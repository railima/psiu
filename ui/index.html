<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psiu</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --side: #efefec; --text: #1d1d1f; --muted: #6e6e73; --border: #e1e1dd;
    --accent: #5b5ef7; --rec: #e5484d; --rec-soft: #fde8e8; --ok: #2e9e5b; --mark: #f5b400; --mark-soft: #fff6d6;
    --s1: #d9480f; --s2: #0b8a6f; --s3: #c2255c; --s4: #1971c2; --s5: #7048e8; --s6: #5c940d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --side: #1a1a1d; --text: #ededf0; --muted: #9a9aa2; --border: #2e2e33;
      --accent: #8b8dff; --rec: #ff5c62; --rec-soft: #3a1d1f; --ok: #4cc27a; --mark: #ffc83d; --mark-soft: #3a3117;
      --s1: #ff8a4c; --s2: #38d9a9; --s3: #f783ac; --s4: #74c0fc; --s5: #b197fc; --s6: #a9e34b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); display: flex; user-select: none; overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  /* Barra lateral */
  aside {
    width: 240px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; font-weight: 600; font-size: 15px; }
  .brand img { width: 28px; height: 28px; }
  .side-actions { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .side-actions input { width: 100%; padding: 7px 10px; font-size: 13px; }
  #history { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  #history .group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 8px 4px; }
  #history button {
    display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 7px; cursor: pointer;
  }
  #history button:hover { background: var(--border); }
  #history button.active { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  #history .t { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #history .d { display: block; font-size: 11px; color: var(--muted); }
  #history .pending .t { color: var(--muted); font-style: italic; }
  #history .empty { color: var(--muted); font-size: 13px; padding: 8px; }
  .side-footer { display: flex; align-items: center; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
  .side-footer select { flex: 1; padding: 5px 8px; font-size: 12px; background: transparent; }

  /* Área principal */
  main { flex: 1; display: flex; flex-direction: column; padding: 24px 28px; min-width: 0; }
  .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }
  .center { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  p.muted { color: var(--muted); margin: 0; max-width: 440px; }
  input, select {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; width: 100%; max-width: 440px; }
  .row input { flex: 1; min-width: 0; }
  .btn {
    font-weight: 500; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--border);
    background: var(--panel); white-space: nowrap;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.danger { color: var(--rec); }
  .btn.danger.confirm { background: var(--rec); color: #fff; border-color: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; text-decoration: underline; }

  .big {
    width: 124px; height: 124px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: var(--rec); box-shadow: 0 8px 28px color-mix(in srgb, var(--rec) 35%, transparent); transition: transform .1s;
  }
  .big:active { transform: scale(.96); }
  .big .dot { width: 42px; height: 42px; border-radius: 50%; background: #fff; }
  .big .square { width: 36px; height: 36px; border-radius: 7px; background: #fff; }
  .recording .big { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 18px var(--rec-soft); } }
  .timer { font-size: 38px; font-variant-numeric: tabular-nums; font-weight: 300; letter-spacing: .02em; }

  .meters { display: grid; grid-template-columns: auto 220px auto; gap: 8px 12px; align-items: center; font-size: 12px; color: var(--muted); }
  .meters label { text-align: right; }
  .meter { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .meter span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 4px; transition: width .12s linear; }
  .meters .state { width: 70px; text-align: left; }
  .btn.mark { border-color: var(--mark); }
  .btn.mark:active { background: var(--mark-soft); }
  .hotkey-hint { font-size: 12px; }
  .hotkey-hint:empty { display: none; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--muted); }

  .spinner {
    width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--rec); max-width: 480px; white-space: pre-wrap; margin: 0; }

  /* Resultado */
  .head { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  #title {
    font-size: 20px; font-weight: 600; border: 1px solid transparent; background: transparent; padding: 4px 8px; margin-left: -9px;
  }
  #title:hover { border-color: var(--border); }
  #title:focus { border-color: var(--accent); background: var(--panel); }
  .stats { color: var(--muted); font-size: 12px; }
  .speakers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .speakers .hint { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .chip {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 4px 2px 10px; background: var(--panel);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chip input { border: 0; background: transparent; padding: 3px 6px; width: 110px; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .toolbar label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toolbar select { padding: 7px 8px; }

  #transcript { flex: 1; overflow-y: auto; padding: 14px 4px 24px; user-select: text; }
  .line { display: grid; grid-template-columns: 66px 1fr; gap: 10px; padding: 6px 0; }
  .line time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .line b { font-weight: 600; margin-right: 6px; }
  .line.mark { background: var(--mark-soft); border-radius: 8px; padding: 6px 8px; margin: 4px -8px; grid-template-columns: 66px 1fr; }
  .line.mark b { color: var(--mark); }
  .empty-transcript { color: var(--muted); text-align: center; padding: 40px; }

  .toast {
    position: fixed; bottom: 22px; left: calc(50% + 120px); transform: translateX(-50%); background: var(--ok); color: #fff;
    padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="icon.png" alt="">Psiu</div>
  <div class="side-actions">
    <button class="btn primary" onclick="newRecording()" data-i18n="new_recording"></button>
    <input id="search" data-i18n-placeholder="search" oninput="renderHistory()">
  </div>
  <div id="history"></div>
  <div class="side-footer">
    <label for="ui-language" aria-label="Language">🌐</label>
    <select id="ui-language" onchange="setUiLanguage(this.value)">
      <option value="en">English</option>
      <option value="pt-BR">Português</option>
    </select>
  </div>
</aside>

<main>
  <!-- Configuração da chave -->
  <section class="view center" id="v-setup">
    <img src="icon.png" alt="" width="88" height="88">
    <h1 data-i18n="setup_title"></h1>
    <p class="muted" data-i18n="setup_text"></p>
    <div class="row">
      <input id="key" type="password" placeholder="API key" autocomplete="off">
      <button class="btn primary" onclick="saveKey()" data-i18n="save"></button>
    </div>
  </section>

  <!-- Pronto para gravar -->
  <section class="view center" id="v-idle">
    <button class="big" onclick="start()" data-i18n-title="start_title"><span class="dot"></span></button>
    <h1 data-i18n="start_title"></h1>
    <div class="row">
      <input id="name" data-i18n-placeholder="name_placeholder">
      <select id="language" data-i18n-title="transcription_language">
        <option value="multi" data-i18n="lang_multi"></option>
        <option value="en" data-i18n="lang_en"></option>
        <option value="pt-BR" data-i18n="lang_pt"></option>
      </select>
    </div>
    <!-- Escolha de microfone: só aparece quando o sistema lista microfones (Windows) -->
    <div class="row" id="mic-row" hidden>
      <select id="mic" data-i18n-title="mic_label" style="flex:1"></select>
    </div>
    <p class="muted" data-i18n="idle_tip"></p>
    <p class="muted hotkey-hint" id="hk-idle"></p>
    <p class="error" id="start-error"></p>
    <button class="link" onclick="show('setup')" data-i18n="change_key"></button>
  </section>

  <!-- Gravando -->
  <section class="view center recording" id="v-recording">
    <button class="big" onclick="stop()" data-i18n-title="stop_title"><span class="square"></span></button>
    <div class="timer" id="timer">00:00</div>
    <div class="meters">
      <label data-i18n="meter_you"></label><div class="meter"><span id="lvl-mic"></span></div><span class="state" id="st-mic"></span>
      <label data-i18n="meter_computer"></label><div class="meter"><span id="lvl-system"></span></div><span class="state" id="st-system"></span>
    </div>
    <button class="btn mark" onclick="mark()"><span data-i18n="mark_button"></span> <kbd>M</kbd></button>
    <p class="muted" id="marks-info"></p>
    <p class="muted hotkey-hint" id="hk-recording"></p>
  </section>

  <!-- Transcrevendo -->
  <section class="view center" id="v-working">
    <div class="spinner"></div>
    <h1 data-i18n="working_title"></h1>
    <p class="muted" data-i18n="working_text"></p>
  </section>

  <!-- Erro de transcrição (o áudio fica salvo) -->
  <section class="view center" id="v-failed">
    <h1 data-i18n="failed_title"></h1>
    <p class="error" id="fail-msg"></p>
    <p class="muted" data-i18n="failed_text"></p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" onclick="retry()" data-i18n="retry"></button>
      <button class="btn" onclick="show('setup')">API key</button>
      <button class="btn danger" id="fail-delete" onclick="del(this)" data-i18n="delete"></button>
    </div>
  </section>

  <!-- Resultado -->
  <section class="view" id="v-result">
    <div class="head">
      <div>
        <input id="title" spellcheck="false" onchange="saveTitle()" onkeydown="if(event.key==='Enter')this.blur()">
        <div class="stats" id="stats"></div>
        <p class="error" id="mic-warning" hidden></p>
      </div>
      <div class="speakers" id="speakers"></div>
      <div class="toolbar">
        <select id="prompt" data-i18n-title="copy_what" onchange="savePromptChoice()"></select>
        <button class="btn primary" onclick="copyText()" data-i18n="copy"></button>
        <label><input type="checkbox" id="timestamps" onchange="api.set_timestamps(this.checked)"> <span data-i18n="timestamps"></span></label>
        <span class="spacer"></span>
        <button class="btn" onclick="api.open_folder(current.folder)" data-i18n="open_folder"></button>
        <button class="btn danger" id="result-delete" onclick="del(this)" data-i18n="delete"></button>
      </div>
    </div>
    <div id="transcript"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
  // ---------- Traduções (inglês é o padrão) ----------

  const I18N = {
    en: {
      new_recording: '● New recording', search: 'Search recordings',
      setup_title: 'Set up Deepgram',
      setup_text: 'Paste your Deepgram API key (console.deepgram.com → API Keys). It is stored only on this computer.',
      save: 'Save', start_title: 'Start recording', name_placeholder: 'Meeting name (optional)',
      transcription_language: 'Transcription language', lang_multi: 'EN + PT', lang_en: 'English', lang_pt: 'Portuguese',
      mic_label: 'Microphone', mic_default: 'Microphone: system default',
      mic_silent: "⚠️ Your microphone recorded only silence, so your voice isn't in this transcript. Check which microphone is selected on the recording screen (it may be a virtual device, like a webcam app that is closed).",
      idle_tip: "Records your microphone and your computer's sound, without joining the call. Use headphones for better results.",
      change_key: 'Change API key', stop_title: 'Stop recording',
      meter_you: 'You', meter_computer: 'Computer', silent: 'silent',
      mark_button: '⭐ Mark moment', marks_hint: 'Mark important moments to highlight them in the transcript.',
      marks_one: '⭐ 1 moment marked.', marks_other: '⭐ {n} moments marked.',
      hk_idle: 'Global hotkeys, even with the app minimized: {toggle} record/stop · {mark} mark moment',
      hk_recording: 'In another window? {toggle} stops recording · {mark} marks a moment',
      working_title: 'Transcribing…', working_text: 'Usually takes less than a minute, even for long meetings.',
      failed_title: "Couldn't transcribe", failed_text: 'The audio is saved; you can try again.', retry: 'Try again',
      delete: 'Delete', confirm_delete: 'Confirm delete',
      untitled: 'Untitled meeting', minutes: '{n} min', participants_one: '1 participant', participants_other: '{n} participants',
      cost: '≈ {cost} on Deepgram', names: 'Names:', rename: 'Rename "{name}"',
      copy_what: 'What to copy', copy_only: 'Transcript only', copy_group: 'With a prompt for the AI',
      copy: 'Copy', timestamps: 'Timestamps', open_folder: 'Open folder',
      copied: 'Copied!', copied_prompt: 'Copied with prompt! Paste it into Claude.',
      marked_moment: '⭐ Marked moment', no_speech: 'No speech detected in this recording.',
      today: 'Today', yesterday: 'Yesterday', last7: 'Last 7 days', other: 'Other',
      not_transcribed: 'not transcribed', no_recordings: 'No recordings yet.', nothing_found: 'Nothing found.',
    },
    'pt-BR': {
      new_recording: '● Nova gravação', search: 'Buscar gravações',
      setup_title: 'Configurar Deepgram',
      setup_text: 'Cole a sua API key da Deepgram (console.deepgram.com → API Keys). Ela fica salva só neste computador.',
      save: 'Salvar', start_title: 'Iniciar gravação', name_placeholder: 'Nome da reunião (opcional)',
      transcription_language: 'Idioma da transcrição', lang_multi: 'EN + PT', lang_en: 'Inglês', lang_pt: 'Português',
      mic_label: 'Microfone', mic_default: 'Microfone: padrão do sistema',
      mic_silent: '⚠️ O seu microfone gravou só silêncio, então a sua voz não está neste transcript. Confira qual microfone está escolhido na tela de gravação (pode ser um dispositivo virtual, como um app de webcam fechado).',
      idle_tip: 'Grava o seu microfone e o som do computador, sem entrar na chamada. Use fone de ouvido para um resultado melhor.',
      change_key: 'Trocar API key', stop_title: 'Parar gravação',
      meter_you: 'Você', meter_computer: 'Computador', silent: 'em silêncio',
      mark_button: '⭐ Marcar momento', marks_hint: 'Marque trechos importantes para destacá-los no transcript.',
      marks_one: '⭐ 1 momento marcado.', marks_other: '⭐ {n} momentos marcados.',
      hk_idle: 'Atalhos globais, mesmo com o app minimizado: {toggle} grava/para · {mark} marca momento',
      hk_recording: 'Em outra janela? {toggle} para a gravação · {mark} marca momento',
      working_title: 'Transcrevendo…', working_text: 'Costuma levar menos de um minuto, mesmo para reuniões longas.',
      failed_title: 'Não foi possível transcrever', failed_text: 'O áudio está salvo; você pode tentar de novo.', retry: 'Tentar de novo',
      delete: 'Excluir', confirm_delete: 'Confirmar exclusão',
      untitled: 'Reunião sem nome', minutes: '{n} min', participants_one: '1 participante', participants_other: '{n} participantes',
      cost: '≈ {cost} na Deepgram', names: 'Nomes:', rename: 'Renomear "{name}"',
      copy_what: 'O que copiar', copy_only: 'Só a transcrição', copy_group: 'Com prompt para a IA',
      copy: 'Copiar', timestamps: 'Horários', open_folder: 'Abrir pasta',
      copied: 'Copiado!', copied_prompt: 'Copiado com prompt! Cole no Claude.',
      marked_moment: '⭐ Momento marcado', no_speech: 'Nenhuma fala detectada nesta gravação.',
      today: 'Hoje', yesterday: 'Ontem', last7: 'Últimos 7 dias', other: 'Outras',
      not_transcribed: 'não transcrita', no_recordings: 'Nenhuma gravação ainda.', nothing_found: 'Nada encontrado.',
    },
  };
  let lang = 'en';

  function t(key, vars = {}) {
    const text = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
    return text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  }

  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((e) => { e.textContent = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((e) => { e.placeholder = t(e.dataset.i18nPlaceholder); });
    document.querySelectorAll('[data-i18n-title]').forEach((e) => { e.title = t(e.dataset.i18nTitle); });
    $('ui-language').value = lang;
  }

  const locale = () => (lang === 'pt-BR' ? 'pt-BR' : 'en-US');

  // ---------- Estado ----------

  let api, current = null, recordings = [], hasKey = false, recording = false, timerId = null, meterId = null, marks = 0;
  const $ = (id) => document.getElementById(id);
  const PALETTE = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  function show(view) {
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'v-' + view));
    document.querySelectorAll('.btn.danger').forEach(resetDelete);
    if (view === 'setup') $('key').focus();
  }

  function el(tag, attrs = {}, ...children) {
    const e = document.createElement(tag);
    Object.assign(e, attrs);
    e.append(...children);
    return e;
  }

  function clock(seconds, withHours) {
    const s = Math.floor(seconds), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
    return (h || withHours) ? `${String(h).padStart(2, '0')}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  // ---------- Histórico ----------

  function parseName(name) {
    const m = name.match(/^(\d{4})-(\d\d)-(\d\d)_(\d\d)(\d\d)\d*_?(.*)$/);
    if (!m) return { date: null, label: name };
    return { date: new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]), label: m[6].replace(/-/g, ' ') };
  }

  function groupOf(date) {
    if (!date) return t('other');
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((today - new Date(date.getFullYear(), date.getMonth(), date.getDate())) / 864e5);
    if (days === 0) return t('today');
    if (days === 1) return t('yesterday');
    if (days < 7) return t('last7');
    return date.toLocaleDateString(locale(), { month: 'long', year: 'numeric' });
  }

  function renderHistory() {
    const box = $('history'), q = $('search').value.trim().toLowerCase();
    box.innerHTML = '';
    let lastGroup = null, count = 0;
    for (const r of recordings) {
      const { date, label } = parseName(r.name);
      const title = r.title || label || t('untitled');
      if (q && !(title + ' ' + r.name).toLowerCase().includes(q)) continue;
      const group = groupOf(date);
      if (group !== lastGroup) { box.append(el('div', { className: 'group', textContent: group })); lastGroup = group; }
      const when = date ? date.toLocaleString(locale(), { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
      const b = el('button', { title: r.name, onclick: () => openRecording(r.folder) },
        el('span', { className: 't', textContent: title }),
        el('span', { className: 'd', textContent: r.done ? when : `${when} · ${t('not_transcribed')}` }));
      if (!r.done) b.classList.add('pending');
      if (current && current.folder === r.folder) b.classList.add('active');
      box.append(b);
      count++;
    }
    if (!count) box.append(el('div', { className: 'empty', textContent: q ? t('nothing_found') : t('no_recordings') }));
  }

  let hotkeys = null;
  function renderHotkeyHints() {
    if (!hotkeys) return;
    const k = (label) => `<kbd>${label}</kbd>`;
    $('hk-idle').innerHTML = t('hk_idle', { toggle: k(hotkeys.toggle), mark: k(hotkeys.mark) });
    $('hk-recording').innerHTML = t('hk_recording', { toggle: k(hotkeys.toggle), mark: k(hotkeys.mark) });
  }

  function renderPromptOptions(prompts) {
    const select = $('prompt'), selected = select.value || store.get('prompt') || '';
    select.innerHTML = '';
    select.append(el('option', { value: '', textContent: t('copy_only') }));
    const group = el('optgroup', { label: t('copy_group') });
    for (const p of prompts) group.append(el('option', { value: p.id, textContent: p.label }));
    select.append(group);
    select.value = [...select.options].some((o) => o.value === selected) ? selected : '';
  }

  function renderMarksInfo() {
    $('marks-info').textContent = marks === 0 ? t('marks_hint') : marks === 1 ? t('marks_one') : t('marks_other', { n: marks });
  }

  async function refresh() {
    const s = await api.state();
    hasKey = s.has_key;
    recordings = s.recordings;
    hotkeys = s.hotkeys;
    if (s.ui_language !== lang) { lang = s.ui_language; applyI18n(); }
    $('language').value = s.language;
    $('timestamps').checked = s.timestamps;
    renderHotkeyHints();
    renderPromptOptions(s.prompts);
    renderMarksInfo();
    renderHistory();
    return s;
  }

  // ---------- Configuração ----------

  async function setUiLanguage(value) {
    await api.set_ui_language(value);
    await refresh();
    loadMicrophones();
    // Nomes padrão dos falantes ("Speaker 1"/"Pessoa 1") vêm do Python no idioma atual.
    if (current && current.lines && !recording) current = await api.open_recording(current.folder);
    if (current && current.lines && document.querySelector('#v-result.active')) renderResult();
  }

  async function saveKey() {
    const key = $('key').value.trim();
    if (!key) return;
    await api.save_key(key);
    $('key').value = '';
    await refresh();
    show('idle');
  }

  function newRecording() {
    if (recording) return;
    current = null;
    renderHistory();
    show(hasKey ? 'idle' : 'setup');
    $('name').focus();
  }

  // ---------- Gravação ----------

  // Chamado pelo botão e pelo atalho global (fromHotkey = true, com o app possivelmente em segundo plano).
  let transcribing = false;
  async function toggleRecording(fromHotkey) {
    if (transcribing) return;
    if (recording) {
      if (fromHotkey) api.sound('stop');
      return stop(fromHotkey);
    }
    const ok = await start();
    if (fromHotkey) {
      api.sound(ok ? 'start' : 'error');
      if (!ok) api.bring_to_front();
    }
  }

  async function start() {
    $('start-error').textContent = '';
    if (recording || transcribing) return false;
    if (!hasKey) { show('setup'); return false; }
    const r = await api.start($('name').value, $('language').value, $('mic').value);
    if (r.error) { show('idle'); $('start-error').textContent = r.error; return false; }
    recording = true;
    const t0 = Date.now();
    const tick = () => { $('timer').textContent = clock((Date.now() - t0) / 1000); };
    tick();
    timerId = setInterval(tick, 500);
    meterId = setInterval(updateMeters, 150);
    marks = 0;
    renderMarksInfo();
    show('recording');
    $('name').value = '';
    refresh();
    return true;
  }

  const silentSince = { mic: Date.now(), system: Date.now() };
  async function updateMeters() {
    const lv = await api.levels();
    for (const k of ['mic', 'system']) {
      $('lvl-' + k).style.width = Math.round(lv[k] * 100) + '%';
      if (lv[k] > 0.08) silentSince[k] = Date.now();
      const quiet = Date.now() - silentSince[k] > 4000;
      $('st-' + k).textContent = quiet ? t('silent') : '';
    }
  }

  async function mark(fromHotkey) {
    if (!recording) return;
    if (fromHotkey) api.sound('mark');
    marks = await api.mark();
    renderMarksInfo();
  }

  async function stop(fromHotkey) {
    recording = false;
    transcribing = true;
    clearInterval(timerId);
    clearInterval(meterId);
    show('working');
    try {
      handleResult(await api.stop($('language').value));
    } finally {
      transcribing = false;
    }
    if (fromHotkey) api.bring_to_front();  // mostra o transcript assim que fica pronto
  }

  // ---------- Transcrições ----------

  async function retry() {
    show('working');
    handleResult(await api.transcribe(current.folder, $('language').value));
  }

  async function openRecording(folder) {
    if (recording) return;
    current = { folder };
    renderHistory();
    handleResult(await api.open_recording(folder));
  }

  function handleResult(r) {
    current = r;
    refresh();
    if (r.error) { $('fail-msg').textContent = r.error; show('failed'); return; }
    renderResult();
    show('result');
  }

  function speakerColor(speaker) {
    if (speaker === current.me) return 'var(--accent)';
    const i = current.speakers.filter((s) => s !== current.me).indexOf(speaker);
    return `var(${PALETTE[i % PALETTE.length]})`;
  }

  function renderResult() {
    const r = current, name = (s) => r.labels[s];
    const { label } = parseName(r.name);
    $('title').value = r.title || label || '';
    $('title').placeholder = t('untitled');

    const mins = Math.max(1, Math.round(r.duration / 60));
    const cost = r.cost.toLocaleString(locale(), { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
    const n = r.speakers.length;
    const parts = [t('minutes', { n: mins }), n === 1 ? t('participants_one') : t('participants_other', { n }), t('cost', { cost })];
    if (r.marks.length) parts.splice(2, 0, `${r.marks.length} ⭐`);
    $('stats').textContent = parts.join(' · ');
    $('mic-warning').textContent = t('mic_silent');
    $('mic-warning').hidden = !r.mic_silent;

    const sp = $('speakers');
    sp.innerHTML = '';
    if (n) sp.append(el('span', { className: 'hint', textContent: t('names') }));
    for (const s of r.speakers) {
      const input = el('input', { value: name(s), placeholder: r.defaults[s], spellcheck: false, title: t('rename', { name: r.defaults[s] }) });
      input.onchange = async () => { current = await api.rename_speaker(r.folder, s, input.value); renderResult(); };
      input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
      const dot = el('i');
      dot.style.background = speakerColor(s);
      sp.append(el('label', { className: 'chip' }, dot, input));
    }

    const box = $('transcript');
    box.innerHTML = '';
    const items = [...r.lines, ...r.marks.map((m) => ({ start: m, mark: true }))].sort((a, b) => a.start - b.start);
    const withHours = r.duration >= 3600;
    for (const u of items) {
      if (u.mark) {
        box.append(el('div', { className: 'line mark' },
          el('time', { textContent: clock(u.start, withHours) }), el('div', {}, el('b', { textContent: t('marked_moment') }))));
        continue;
      }
      const who = el('b', { textContent: name(u.speaker) });
      who.style.color = speakerColor(u.speaker);
      box.append(el('div', { className: 'line' },
        el('time', { textContent: clock(u.start, withHours) }), el('div', {}, who, u.text)));
    }
    if (!items.length) box.append(el('div', { className: 'empty-transcript', textContent: t('no_speech') }));
    box.scrollTop = 0;
  }

  async function saveTitle() {
    recordings = await api.set_title(current.folder, $('title').value);
    current.title = $('title').value.trim();
    renderHistory();
  }

  function savePromptChoice() { store.set('prompt', $('prompt').value); }

  async function copyText() {
    await api.copy(current.folder, $('prompt').value, $('timestamps').checked);
    const toast = $('toast');
    toast.textContent = $('prompt').value ? t('copied_prompt') : t('copied');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  // Excluir em dois cliques, sem diálogos do sistema.
  function resetDelete(b) { b.classList.remove('confirm'); b.textContent = t('delete'); clearTimeout(b._t); }
  async function del(b) {
    if (!b.classList.contains('confirm')) {
      b.classList.add('confirm');
      b.textContent = t('confirm_delete');
      b._t = setTimeout(() => resetDelete(b), 4000);
      return;
    }
    resetDelete(b);
    recordings = await api.delete(current.folder);
    newRecording();
  }

  // ---------- Atalhos ----------

  $('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveKey(); });
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
  document.addEventListener('keydown', (e) => {
    if (recording && (e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); mark(); }
  });

  applyI18n();
  async function loadMicrophones() {
    const { devices, selected } = await api.microphones();
    const select = $('mic');
    select.innerHTML = '';
    select.append(el('option', { value: '', textContent: t('mic_default') }));
    for (const name of devices) select.append(el('option', { value: name, textContent: name }));
    select.value = devices.includes(selected) ? selected : '';
    $('mic-row').hidden = !devices.length;
  }

  window.addEventListener('pywebviewready', async () => {
    api = window.pywebview.api;
    const s = await refresh();
    loadMicrophones();
    show(s.has_key ? 'idle' : 'setup');
  });
</script>
</body>
</html>
